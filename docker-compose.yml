services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wellcosting
      POSTGRES_USER: wellcosting
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wellcosting -d wellcosting"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://wellcosting:${POSTGRES_PASSWORD}@db:5432/wellcosting
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      # First-run administrator: seeded from these values, otherwise `docker compose exec -it api python -m app.seed`.
      BOOTSTRAP_ADMIN_ON_STARTUP: ${BOOTSTRAP_ADMIN_ON_STARTUP:-true}
      SEED_ORG_SLUG: ${SEED_ORG_SLUG:-}
      SEED_ORG_NAME: ${SEED_ORG_NAME:-}
      SEED_OWNER_NAME: ${SEED_OWNER_NAME:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
volumes:
  postgres_data:
