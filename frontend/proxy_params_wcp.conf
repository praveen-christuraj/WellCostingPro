# Shared proxy settings for the API upstream.
#
# X-Forwarded-For and X-Real-IP are *overwritten* from the connection address, not
# appended from whatever the client sent. The API only believes these headers when
# the connecting peer is in TRUSTED_PROXY_IPS, so spoofing requires control of the
# proxy itself.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Connection "";
proxy_connect_timeout 10s;
proxy_read_timeout 120s;
proxy_send_timeout 120s;
proxy_hide_header X-Powered-By;
proxy_hide_header Server;
