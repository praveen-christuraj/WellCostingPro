<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B2A47"/>
      <stop offset="100%" stop-color="#123A63"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="400" fill="url(#bgGrad)"/>
  
  <!-- Grid lines for technical feel -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="0.5">
    <line x1="0" y1="50" x2="500" y2="50"/>
    <line x1="0" y1="100" x2="500" y2="100"/>
    <line x1="0" y1="150" x2="500" y2="150"/>
    <line x1="0" y1="200" x2="500" y2="200"/>
    <line x1="0" y1="250" x2="500" y2="250"/>
    <line x1="0" y1="300" x2="500" y2="300"/>
    <line x1="0" y1="350" x2="500" y2="350"/>
    <line x1="50" y1="0" x2="50" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="250" y1="0" x2="250" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="350" y1="0" x2="350" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
  </g>
  
  <!-- Depth markers on the left -->
  <g stroke="#A7B8CB" stroke-opacity="0.4" stroke-width="0.5">
    <line x1="30" y1="50" x2="45" y2="50"/>
    <line x1="30" y1="100" x2="45" y2="100"/>
    <line x1="30" y1="150" x2="45" y2="150"/>
    <line x1="30" y1="200" x2="45" y2="200"/>
    <line x1="30" y1="250" x2="45" y2="250"/>
    <line x1="30" y1="300" x2="45" y2="300"/>
    <line x1="30" y1="350" x2="45" y2="350"/>
  </g>
  
  <!-- Rig/Derrick structure -->
  <g stroke="#8FB8E4" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.7">
    <!-- Main tower legs -->
    <line x1="380" y1="180" x2="420" y2="40"/>
    <line x1="460" y1="180" x2="420" y2="40"/>
    <!-- Horizontal braces -->
    <line x1="385" y1="170" x2="455" y2="170"/>
    <line x1="392" y1="145" x2="448" y2="145"/>
    <line x1="400" y1="120" x2="440" y2="120"/>
    <line x1="408" y1="95" x2="432" y2="95"/>
    <line x1="415" y1="70" x2="425" y2="70"/>
    <!-- X bracing -->
    <line x1="385" y1="170" x2="448" y2="145"/>
    <line x1="455" y1="170" x2="392" y2="145"/>
    <line x1="392" y1="145" x2="440" y2="120"/>
    <line x1="448" y1="145" x2="400" y2="120"/>
    <line x1="400" y1="120" x2="432" y2="95"/>
    <line x1="440" y1="120" x2="408" y2="95"/>
    <line x1="408" y1="95" x2="425" y2="70"/>
    <line x1="432" y1="95" x2="415" y2="70"/>
    <!-- Crown block -->
    <rect x="414" y="34" width="12" height="6" rx="1" fill="#8FB8E4" stroke="none" opacity="0.8"/>
    <!-- Derrick base/ground level -->
    <line x1="370" y1="180" x2="470" y2="180" stroke-width="3"/>
    <!-- Base supports -->
    <line x1="370" y1="180" x2="380" y2="180" stroke-width="3"/>
    <line x1="460" y1="180" x2="470" y2="180" stroke-width="3"/>
  </g>
  
  <!-- Drill pipe going into the well (vertical section) -->
  <line x1="420" y1="180" x2="420" y2="220" stroke="#8FB8E4" stroke-width="2" stroke-opacity="0.6"/>
  
  <!-- J-Profile Well Path (directional well) -->
  <g stroke="#8FB8E4" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.5">
    <!-- Build section (curving from vertical to horizontal) -->
    <path d="M 420 220 Q 420 260, 440 280 Q 460 300, 480 310 Q 490 315, 495 320"/>
    <!-- Hold/section continuation -->
    <path d="M 495 320 L 498 340"/>
  </g>
  
  <!-- Well path tangent line extension (showing direction) -->
  <g stroke="#8FB8E4" stroke-width="1" stroke-dasharray="4,4" stroke-opacity="0.3">
    <line x1="498" y1="340" x2="505" y2="365"/>
  </g>
  
  <!-- Target point (circle with crosshair) -->
  <g transform="translate(498, 340)" stroke="#8FB8E4" stroke-width="1.5" fill="none" stroke-opacity="0.6">
    <circle cx="0" cy="0" r="8"/>
    <line x1="-12" y1="0" x2="12" y2="0"/>
    <line x1="0" y1="-12" x2="0" y2="12"/>
  </g>
  <circle cx="498" cy="340" r="3" fill="#8FB8E4" fill-opacity="0.6"/>
  
  <!-- Target label -->
  <text x="505" y="355" fill="#A7B8CB" font-family="Manrope, Arial, sans-serif" font-size="9" font-weight="600" fill-opacity="0.6">TARGET</text>
  
  <!-- Surface location marker -->
  <g transform="translate(420, 180)" stroke="#8FB8E4" stroke-width="1.5" fill="none" stroke-opacity="0.6">
    <circle cx="0" cy="0" r="4"/>
  </g>
  
  <!-- Surface label -->
  <text x="405" y="175" fill="#A7B8CB" font-family="Manrope, Arial, sans-serif" font-size="9" font-weight="600" fill-opacity="0.6">SURFACE</text>
  
  <!-- Kick-off point label -->
  <text x="425" y="245" fill="#A7B8CB" font-family="Manrope, Arial, sans-serif" font-size="8" fill-opacity="0.5">KOP</text>
  
  <!-- Depth annotation on right -->
  <g fill="#A7B8CB" font-family="Manrope, Arial, sans-serif" font-size="8" fill-opacity="0.4">
    <text x="475" y="55">500m</text>
    <text x="475" y="105">1000m</text>
    <text x="475" y="155">1500m</text>
    <text x="475" y="205">2000m</text>
    <text x="475" y="255">2500m</text>
    <text x="475" y="305">3000m</text>
    <text x="475" y="355">3500m</text>
  </g>
  
  <!-- Well trajectory angle indicator -->
  <g stroke="#8FB8E4" stroke-width="0.8" stroke-opacity="0.4" fill="none">
    <path d="M 485 305 L 495 305 L 495 295"/>
  </g>
  <text x="478" y="298" fill="#8FB8E4" font-family="Manrope, Arial, sans-serif" font-size="7" fill-opacity="0.4">DIP</text>
</svg>
