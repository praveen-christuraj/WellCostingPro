# WellCostIQ web tier.
#
# Serves the built single-page application and proxies /api to the FastAPI
# service. The edge owns the controls a browser never sees: request-size limits,
# rate limits, secure response headers and an origin that never exposes
# Swagger/OpenAPI in production.
#
# NOTE ON add_header: nginx does not inherit `add_header` into a location that
# declares its own. The header block therefore lives at server level only, and the
# two locations that need caching policy use `expires` instead of `add_header`.

# Auth endpoints are the only unauthenticated writes, so they receive the tightest
# budget. `limit_req` is generous enough for a shared office NAT and still stops
# credential stuffing from one address; the API adds account-aware budgets behind it.
limit_req_zone $binary_remote_addr zone=auth_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=auth_recovery:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=api_general:10m rate=600r/m;

server {
    listen 80;
    server_name _;
    # Do not advertise the nginx version.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Ordinary JSON and document uploads. The backup-import location raises this
    # for its own path only, because archives are intentionally much larger.
    client_max_body_size 20m;
    client_body_timeout 20s;
    client_header_timeout 20s;
    keepalive_timeout 30s;
    send_timeout 30s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # MUI/emotion injects a stylesheet at runtime, so styles need 'unsafe-inline';
    # scripts do not. Charts, PDF and downloads use blob:/data: URLs.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # Health is answered by the API; keep it cheap and unauthenticated.
    location = /api/health {
        proxy_pass http://api:8000/api/health;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /api/v1/auth/login {
        limit_req zone=auth_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        include /etc/nginx/proxy_params_wcp.conf;
    }

    location ~ ^/api/v1/auth/(refresh|forgot-password|reset-password|change-password)$ {
        limit_req zone=auth_recovery burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        include /etc/nginx/proxy_params_wcp.conf;
    }

    # Archives are uploaded here; only this path may exceed the default limit.
    location = /api/v1/backup/jobs/import {
        client_max_body_size 2048m;
        client_body_timeout 600s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
        proxy_pass http://api:8000;
        include /etc/nginx/proxy_params_wcp.conf;
    }

    location /api/ {
        limit_req zone=api_general burst=120 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        include /etc/nginx/proxy_params_wcp.conf;
    }

    # API documentation is a development aid. In production these routes do not
    # exist in the API either (ENVIRONMENT=production disables them); this refuses
    # to forward them if a build is misconfigured.
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }

    # Hashed build assets are immutable.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # The SPA shell must be revalidated: a stale bundle can talk to a newer API.
    location / {
        try_files $uri $uri/ /index.html;
        expires epoch;
    }
}
