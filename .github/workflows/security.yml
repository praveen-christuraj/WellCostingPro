name: Security and regression checks
on:
  pull_request:
  push:
    branches: [main, 'arena/**']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.lock
      - run: pip install pip-audit bandit
      - run: pip-audit -r backend/requirements.lock
      # Static findings need triage, not silent suppression; fail on HIGH, report all.
      - run: bandit -r backend/app -lll
      - run: bandit -r backend/app -f json -o bandit-results.json --exit-zero
      - uses: actions/upload-artifact@v4
        with:
          name: bandit-results
          path: bandit-results.json
      - run: python -m pytest -q
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=low
        working-directory: frontend
      - run: npm run test:security
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
